<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="static/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <script src="static/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="static/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script src="static/npm/sockjs-client@1.6.1/dist/sockjs.js"></script>
    <title>xterm.js</title>
  </style>
  </head>
  <body>
    <div id="tty"></div>
    <script>
      window.addEventListener("load", function() {
        const command = {
          // client side
          INPUT: 'I',

          // server side
          OUTPUT: 'O',
        }

        const textEncoder = new TextEncoder();

        const terminal = new Terminal({ cursorBlink: true });
        terminal.open(document.getElementById('tty'));
        terminal.write('Hello from \x1B[1;3;31mxterm.js\x1B[0m $ ');
        terminal.onData(onTerminalData);
        terminal.onBinary(onTerminalBinary);

        function onTerminalData(data) {
          if (!socket || socket.readyState !== socket.OPEN) return;
          if (typeof data !== 'string') {
            throw new Error('onTerminalData: unexpected data type: ' + (typeof data));
          }
          socket.send(textEncoder.encode(command.INPUT + data));
        }

        function onTerminalBinary(data) {
          throw new Error('onTerminalBinary: unexpected call');
        }

        const socket = new WebSocket('http://[::1]:7681/ws');
        socket.binaryType = 'arraybuffer';
        socket.onerror = onSocketError;
        socket.onopen = onSocketOpen;
        socket.onclose = onSocketClose;
        socket.onmessage = onSocketMessage;

        function onSocketError(ev) {
          throw new Error(`onSocketError code=${ev.code}`);
        }

        function onSocketOpen(ev) {
          // throw new Error(`onSocketOpen code=${ev.code}`);
        }

        function onSocketClose(ev) {
          console.log('[] socket connection closed with code: ' + ev.code);
        }

        function onSocketMessage(ev) {
          throw new Error(`onSocketMessage code=${ev.code}`);
        }
     });
    </script>
  </body>
</html>
